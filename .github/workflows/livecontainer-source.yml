name: Update LiveContainer Source

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: livecontainer-source
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.repository == 'EstusFlask/animeko' && (github.event_name == 'workflow_dispatch' || github.event.release.tag_name != 'livecontainer-source') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish persistent source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/livecontainer_source.py --repository "$GITHUB_REPOSITORY" --publish
