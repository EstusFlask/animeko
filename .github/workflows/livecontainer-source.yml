name: Update LiveContainer Source

on:
  push:
    tags: ['fork-source/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: livecontainer-source
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.repository == 'EstusFlask/animeko' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish persistent source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/livecontainer_source.py --repository "$GITHUB_REPOSITORY" --publish
